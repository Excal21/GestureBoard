name: Test and Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  
jobs:
  Test:
    runs-on: windows-latest
    steps:
      - name: Bypass Cloudflare
        uses: xiaotianxt/bypass-cloudflare-for-github-action@v1.1.1
        with:
          cf_zone_id: ${{ secrets.CF_ZONE_ID }}
          cf_api_token: ${{ secrets.CF_API_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Cache virtual environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('./App/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-
#
      - name: Set up virtual environment
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\pip.exe install -r ./App/requirements.txt
          .venv\Scripts\pip.exe install flask
          .venv\Scripts\pip.exe install pytest-qt
          .venv\Scripts\pip.exe install pyinstaller pytest-cov pytest-github-actions-annotate-failures
        if: steps.cache-venv.outputs.cache-hit != 'true'

      - name: Run tests with coverage
        id: tests
        run: .venv\Scripts\pytest.exe --disable-warnings --junitxml=pytest.xml --cov=App --cov=docker --cov-report=xml:coverage.xml

      - name: Pytest coverage comment
        if: always()
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: ./coverage.xml
          junitxml-path: ./pytest.xml

  Win64_Build:
    needs: Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Restore virtual environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('./App/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Set up virtual environment
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\pip.exe install -r ./App/requirements.txt
          .venv\Scripts\pip.exe install pyinstaller==6.14.2
        if: steps.cache-venv.outputs.cache-hit != 'true'

      - name: Ensure correct PyInstaller version
        run: .venv\Scripts\pip.exe install pyinstaller==6.14.2 --force-reinstall

      - name: Build with PyInstaller
        shell: cmd
        run: |
          .venv\Scripts\pyinstaller ./App/main.py ^
            --windowed ^
            --icon=./App/Resources/Icons/hand.ico ^
            --hidden-import=tensorflow ^
            --noconfirm ^
            --clean ^
            --distpath ./build_dist

      - name: Copy config/data/resources
        run: |
          mkdir ./build_dist/Config
          mkdir ./build_dist/Data
          mkdir ./build_dist/Resources
          xcopy /E /I /Y .\App\Config .\build_dist\Config
          xcopy /E /I /Y .\App\Data .\build_dist\Data
          xcopy /E /I /Y .\App\Resources .\build_dist\Resources

      - name: Clean up folder structure
        shell: cmd
        run: |
          xcopy /E /I /Y build_dist\main\* build_dist\
          rmdir /S /Q build_dist\main

      - name: Rename executable
        shell: cmd
        run: rename build_dist\main.exe GestureBoard.exe

      - name: Sign Executable
        uses: skymatic/code-sign-action@v3
        with:
          certificate: '${{ secrets.CERTIFICATE }}'
          password: '${{ secrets.PASSWORD }}'
          certificatesha1: '${{ secrets.CERTIFICATESHA1 }}'
          timestampUrl: 'http://timestamp.digicert.com'
          folder: 'build_dist'
          recursive: false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestureBoard_Windows64
          path: ./build_dist

      - name: VirusTotal Scan
        id: vt_scan
        uses: cssnr/virustotal-action@v1
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          file_globs: |
            build_dist/GestureBoard.exe
          rate_limit: 4
          summary: false

      - name: Wait for VirusTotal Analysis
        shell: bash
        run: sleep 120

      - name: Check VirusTotal Result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE_PATH="build_dist/GestureBoard.exe"
          FILE_HASH=$(sha256sum "$FILE_PATH" | awk '{ print $1 }')

          echo "🔍 Checking VirusTotal results for hash: $FILE_HASH"

          REPORT=$(curl -s --request GET \
            --url "https://www.virustotal.com/api/v3/files/$FILE_HASH" \
            --header "x-apikey: ${{ secrets.VIRUSTOTAL_API_KEY }}")

          MALICIOUS=$(echo "$REPORT" | jq '.data.attributes.last_analysis_stats.malicious')
          echo "⚠️ Malicious detections: $MALICIOUS"

          # készítsük el a Markdown riportot változóba
          SUMMARY_MD=$(cat <<EOF
          ## 🛡️ VirusTotal Report

          **Malicious detections:** $MALICIOUS

          | Engine | Category | Result |
          |--------|----------|--------|
          $(echo "$REPORT" | jq -r '.data.attributes.last_analysis_results | to_entries[] | select(.value.category=="malicious") | "| " + .key + " | " + .value.category + " | " + .value.result + " |"')
          EOF
          )

          # írás az Action Summary-ba
          echo "$SUMMARY_MD" >> $GITHUB_STEP_SUMMARY

          # ha pull_request az event, írjuk ki kommentbe is
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
              -f body="$SUMMARY_MD"
          fi

          if [ "$MALICIOUS" -gt 5 ]; then
            echo "❌ Too many detections ($MALICIOUS), failing build."
            exit 1
          fi